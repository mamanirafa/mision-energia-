<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Energía Austral · Compensación 2° año</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   MISIÓN ENERGÍA AUSTRAL · estilos
   Paleta: noche austral (navy), Canal Beagle (teal), chispa (ámbar)
   =========================================================== */
:root{
  --bg:#0a1726; --bg2:#0f2135; --panel:#132a42; --panel2:#18334f; --line:#28476a;
  --ink:#eef4f8; --ink2:#a9bfd1; --teal:#2ec4b6; --teal-soft:#123f45; --amber:#ffb703; --amber-soft:#3d3214;
  --coral:#ff6b6b; --coral-soft:#3f1f27; --ok:#4ade80; --ok-soft:#163a2a; --violet:#a78bfa; --violet-soft:#2a2547;
  --cream:#fff8e7;
  --t-energia:#ffb703; --t-centrales:#2ec4b6; --t-sistemas:#a78bfa; --t-proyecto:#ff8fab;
  --r:14px; --shadow:0 10px 30px -14px rgba(0,0,0,.7);
  --f-title:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#173a5c 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.05rem;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-title);line-height:1.15;margin:0 0 .5rem;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:800}
h2{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800}
h3{font-size:1.18rem}
p{margin:0 0 .85rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:.9rem} .center{text-align:center}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center} .spacer{flex:1}

/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:30;background:rgba(10,23,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:860px;margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{font-family:var(--f-title);font-weight:800;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.brand b{color:var(--amber)}
.chips{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.score{background:var(--amber-soft);border-color:#6b5517;color:var(--amber);font-weight:700}
.chip.score.bump{animation:bump .5s}
.chip.streak{color:#ffa94d}
.chip.sync-ok{color:var(--ok)} .chip.sync-wait{color:var(--amber)} .chip.sync-off{color:var(--ink2)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;cursor:pointer;color:var(--ink2);font-size:.85rem}
.icon-btn:hover{color:var(--ink);border-color:var(--ink2)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.lvlbar{max-width:860px;margin:0 auto;padding:0 1rem .55rem}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem}
.phase{font-size:.75rem;text-align:center;padding:.25rem .2rem;border-radius:8px;background:var(--panel);color:var(--ink2);border:1px solid transparent}
.phase.done{background:var(--teal-soft);color:var(--teal)}
.phase.now{border-color:var(--amber);color:var(--ink);font-weight:700}

/* ---------- Layout ---------- */
main{max-width:860px;margin:0 auto;padding:1.25rem 1rem 4rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow);margin-bottom:1rem}
.panel.edge{border-left:6px solid var(--amber)}
.kicker{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);font-weight:700;margin-bottom:.2rem}
footer{max-width:860px;margin:0 auto;padding:1rem;color:var(--ink2);font-size:.85rem;border-top:1px solid var(--line)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:2px solid transparent;border-radius:12px;padding:.7rem 1.2rem;min-height:46px;background:var(--amber);color:#1b1300;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.teal{background:var(--teal);color:#062320}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.sm{min-height:36px;padding:.4rem .8rem;font-size:.92rem}
.linkish{background:none;border:none;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer;font-weight:700}

/* ---------- Portada ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:1rem;align-items:center;margin:1rem 0 1.5rem}
.hero .lede{font-size:1.12rem;color:var(--ink2)}
.hero svg{width:100%;max-width:300px;justify-self:center}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero svg{max-width:200px}}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.8rem 0}
.rule{background:var(--panel2);border-radius:12px;padding:.75rem .9rem;font-size:.95rem}
.rule b{display:block;font-family:var(--f-title);color:var(--amber)}
@media (max-width:560px){.rules{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:.3rem;margin:.6rem 0}
.input{background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:.7rem .85rem;width:100%}
.input:focus{border-color:var(--teal);outline:none}
.name-preview{font-family:var(--f-title);font-size:1.5rem;font-weight:800;color:var(--amber);min-height:2rem}

/* ---------- Mapa ---------- */
.map{display:grid;gap:.8rem}
.lvl-card{display:grid;grid-template-columns:72px 1fr auto;gap:1rem;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:1rem;text-align:left;cursor:pointer;width:100%;transition:transform .15s,border-color .15s}
.lvl-card:hover:not([disabled]){transform:translateY(-2px);border-color:var(--amber)}
.lvl-card[disabled]{opacity:.45;cursor:not-allowed}
.lvl-card.done{border-color:var(--teal)}
.lvl-card.current{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.lvl-ico{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--panel2);border:2px solid var(--line)}
.lvl-card.done .lvl-ico{background:var(--teal-soft);border-color:var(--teal)}
.stars{color:var(--amber);letter-spacing:.1em;font-size:1.1rem;white-space:nowrap}
.stars .off{color:var(--line)}
@media (max-width:560px){.lvl-card{grid-template-columns:52px 1fr;gap:.7rem}.lvl-ico{width:52px;height:52px;font-size:1.5rem}.lvl-card>div:last-child{grid-column:2}}
.lvl-meta{font-size:.85rem;color:var(--ink2)}
.tema-dots{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.tdot{font-size:.72rem;padding:.08rem .5rem;border-radius:999px;border:1px solid currentColor}
.t-energia{color:var(--t-energia)} .t-centrales{color:var(--t-centrales)} .t-sistemas{color:var(--t-sistemas)} .t-proyecto{color:var(--t-proyecto)}

/* ---------- Lectura ---------- */
.reading-sec{border-left:5px solid var(--sec,var(--amber));padding-left:1rem;margin:1.2rem 0}
.reading-sec h3{color:var(--sec,var(--amber))}
.reading-sec ul{margin:.2rem 0 .8rem;padding-left:1.2rem}
.reading-sec li{margin:.2rem 0}
.box{background:var(--panel2);border-radius:12px;padding:.75rem .9rem;margin:.7rem 0;font-size:.97rem}
.box.key{border:1px dashed var(--amber)}
.box.local{border:1px dashed var(--teal)}
.box b.lab{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--amber)}
.box.local b.lab{color:var(--teal)}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem;margin:.5rem 0 .8rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2);color:var(--amber)}
.tblwrap{overflow-x:auto}
.got-it{margin-top:.3rem}
.got-it.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.flow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.5rem 0 .9rem}
.flow span{background:var(--panel2);border-radius:8px;padding:.25rem .55rem;font-size:.88rem}
.flow i{font-style:normal;color:var(--amber)}

/* ---------- Opciones / desafíos ---------- */
.opts{display:grid;gap:.55rem;margin:.8rem 0}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.75rem .9rem;cursor:pointer;min-height:48px;transition:border-color .12s,transform .12s}
.opt:hover:not([disabled]){border-color:var(--teal);transform:translateX(2px)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--coral);background:var(--coral-soft)}
.opt.sel{border-color:var(--amber)}
.opts.two{grid-template-columns:1fr 1fr}
.qhead{display:flex;justify-content:space-between;gap:.5rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.qnum{font-size:.85rem;color:var(--ink2)}
.qbar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:1rem}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .4s}
.qtext{font-size:1.15rem;font-weight:700}
.fb{border-radius:12px;padding:.75rem .9rem;margin:.7rem 0;font-size:.97rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--coral-soft);border:1px solid var(--coral)}
.fb.warn{background:var(--amber-soft);border:1px solid var(--amber)}
.fb.info{background:var(--teal-soft);border:1px solid var(--teal)}
.pool{display:flex;flex-wrap:wrap;gap:.45rem;min-height:48px;padding:.5rem;border:2px dashed var(--line);border-radius:12px;margin:.6rem 0}
.tok{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:.45rem .7rem;cursor:pointer;font-size:.95rem}
.tok.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.tok.ok{border-color:var(--ok)} .tok.bad{border-color:var(--coral);background:var(--coral-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem}
.bucket{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:.6rem;min-height:110px;cursor:pointer;text-align:left}
.bucket:hover{border-color:var(--teal)}
.bucket h4{margin:0 0 .4rem;font-family:var(--f-title);font-size:1rem;color:var(--teal)}
.bucket .tok{display:inline-block;margin:.15rem}
.buckets + .btn,.buckets + .fb{margin-top:.8rem}
.order-list{list-style:none;padding:0;margin:.6rem 0;display:grid;gap:.45rem}
.order-item{display:flex;align-items:center;gap:.5rem;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:.5rem .6rem}
.order-item.ok{border-color:var(--ok)} .order-item.bad{border-color:var(--coral)}
.order-item .n{width:28px;height:28px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-weight:700;flex:none}
.order-item .tx{flex:1}
.mv{background:var(--bg2);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer}
.mv:hover{border-color:var(--teal)}
.floater{position:fixed;z-index:60;font-family:var(--f-title);font-weight:800;font-size:1.6rem;color:var(--amber);pointer-events:none;animation:floatup 1s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Interactivos ---------- */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
@media (max-width:560px){.memo{grid-template-columns:repeat(2,1fr)}}
.mcard{aspect-ratio:4/3;border-radius:12px;border:2px solid var(--line);background:linear-gradient(135deg,var(--panel2),var(--bg2));cursor:pointer;display:grid;place-items:center;padding:.4rem;font-size:.85rem;text-align:center;line-height:1.25}
.mcard.back{font-size:1.8rem;color:var(--amber)}
.mcard.up{background:var(--cream);color:#132a42;border-color:var(--amber)}
.mcard.term.up{font-family:var(--f-title);font-weight:800;font-size:1rem}
.mcard.matched{background:var(--ok-soft);color:var(--ink);border-color:var(--ok);cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.tab{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:.35rem .8rem;cursor:pointer;font-size:.92rem}
.tab.on{border-color:var(--amber);color:var(--amber)}
.tab.done::after{content:" ✓";color:var(--ok)}
.chain{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;min-height:52px;padding:.5rem;background:var(--bg2);border-radius:12px;margin:.6rem 0}
.chain .slot{border:2px dashed var(--line);border-radius:10px;padding:.4rem .6rem;min-width:90px;text-align:center;font-size:.88rem;color:var(--ink2)}
.chain .slot.fill{border-style:solid;border-color:var(--teal);color:var(--ink);background:var(--teal-soft)}
.chain i{font-style:normal;color:var(--amber)}
.xray{position:relative;background:var(--bg2);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.xray svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs circle{fill:var(--amber);stroke:#1b1300;stroke-width:2;transition:r .15s}
.hs text{fill:#1b1300;font-weight:800;font-size:15px;font-family:var(--f-body);pointer-events:none}
.hs.done circle{fill:var(--ok)}
.hs.sel circle{fill:#fff}
.hs:hover circle,.hs:focus circle{r:17}
.hs-list{display:flex;flex-wrap:wrap;gap:.35rem;margin:.6rem 0}
.scard{border:2px solid var(--line);border-radius:14px;background:var(--panel2);padding:.8rem;cursor:pointer;text-align:left;width:100%}
.scard.on{border-color:var(--amber)}
.scard.done{border-color:var(--ok)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.6rem}
.stagebtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.4rem;margin:.6rem 0}
.prog-note{font-size:.9rem;color:var(--ink2);margin-top:.4rem}

/* ---------- Informe ---------- */
.big-score{font-family:var(--f-title);font-size:3rem;font-weight:800;color:var(--amber);line-height:1}
.tema-row{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.tema-row:last-child{border-bottom:none}
.meter{grid-column:1/-1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%}
.status{font-weight:700;font-size:.9rem;white-space:nowrap}
.st-ok{color:var(--ok)} .st-mid{color:var(--amber)} .st-low{color:var(--coral)}
.advice{grid-column:1/-1;font-size:.93rem;color:var(--ink2)}

/* ---------- Certificado ---------- */
.cert{background:var(--cream);color:#132a42;border-radius:6px;padding:2.2rem 2rem;text-align:center;border:10px double #1f4e79;position:relative;font-family:var(--f-body)}
.cert h1{font-family:var(--f-title);color:#1f4e79;font-size:clamp(1.6rem,5vw,2.4rem);margin:.3rem 0}
.cert .cname{font-family:var(--f-title);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;color:#0f766e;border-bottom:2px solid #1f4e79;display:inline-block;padding:0 1rem .2rem;margin:.4rem 0 .8rem}
.cert .cscore{display:flex;justify-content:center;gap:1.4rem;flex-wrap:wrap;margin:1rem 0}
.cert .cscore div{min-width:90px}
.cert .cscore b{display:block;font-family:var(--f-title);font-size:1.6rem;color:#b45309}
.cert .sign{display:flex;justify-content:space-around;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.cert .sign div{border-top:1px solid #132a42;padding-top:.3rem;min-width:180px;font-size:.9rem}
.cert .code{font-size:.8rem;color:#4b5d6b;margin-top:1rem}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #cert, #cert *{visibility:visible}
  #cert{position:absolute;left:0;top:0;width:100%;margin:0}
  @page{size:A4 landscape;margin:12mm}
}
</style>
</head>

<script>
/* ===========================================================
   MISIÓN ENERGÍA AUSTRAL · CONTENIDOS Y CONFIGURACIÓN
   Todo lo que se puede editar sin tocar el motor está acá.
   =========================================================== */
window.CONFIG = {
  titulo: "Misión Energía Austral",
  subtitulo: "Etapa de compensación · Educación Tecnológica",
  curso: "2° año",
  escuela: "Colegio Integral de Educación Ushuaia",
  docente: "Prof. Rafael Mamani",
  // Pegá acá la URL de tu aplicación web de Apps Script (termina en /exec).
  // Si queda vacía, el juego funciona igual pero no guarda en Sheets.
  sheetsUrl: "https://script.google.com/macros/s/AKfycbzp4_PvS4qrS_-eqGhnCCPNk_UDfS2G62etWsAaE7OhU7nom6R1GzD5VDuvhph1RPNnVw/exec",
  preguntasPorNivel: 10,
  puntosPrimerIntento: 10,
  puntosSegundoIntento: 5,
  minimoParaAvanzar: 60,   // puntos sobre 100 por nivel
  intentosMaximos: 3,      // por nivel
  storageKey: "mision-energia-austral-v1"
};

/* Los 4 temas de la compensación: aparecen en TODOS los niveles */
window.TEMAS = {
  energia:   { nombre: "Procesos de transformación de la energía", corto: "Energía", ico: "⚡" },
  centrales: { nombre: "Centrales de generación de energía eléctrica", corto: "Centrales", ico: "🏭" },
  sistemas:  { nombre: "Sistemas técnicos en una central", corto: "Sistemas técnicos", ico: "⚙️" },
  proyecto:  { nombre: "Etapas del proyecto tecnológico", corto: "Proyecto tecnológico", ico: "🧭" }
};

window.ETAPAS = ["Identificación del problema", "Búsqueda de información", "Diseño y análisis del producto", "Organización y gestión", "Planificación", "Construcción del producto o prototipo", "Evaluación y perfeccionamiento"];

window.NIVELES = [
/* =================================================================
   NIVEL 1 · RECONOCER
   ================================================================= */
{
  id: 1, nombre: "Reconocer", rango: "Explorador/a", ico: "🔍",
  mision: "Primera misión: reconocer las piezas del mapa. Vas a identificar los conceptos básicos de los cuatro temas.",
  lectura: [
    { tema: "energia", titulo: "⚡ Energía, fuentes y recursos", html: `
<p>La <b>energía</b> es la <b>capacidad de un cuerpo para realizar un trabajo</b>. Aparece en distintas formas: <b>mecánica</b> (cinética por el movimiento, potencial por la posición), <b>térmica</b>, <b>química</b>, <b>luminosa</b>, <b>sonora</b>, <b>eléctrica</b> y <b>nuclear</b>.</p>
<p>Una <b>fuente de energía</b> es el fenómeno natural o el material del que obtenemos energía: el viento, el sol, el agua de un río, el gas natural, el uranio. La <b>cantidad de energía disponible</b> de una fuente se llama <b>recurso energético</b>.</p>
<div class="box key"><b class="lab">Para no confundir</b>El viento del Canal Beagle es una <b>fuente</b>. Cuánto viento aprovechable hay en Ushuaia es el <b>recurso energético</b>.</div>
<p>Según si se agotan o no, las fuentes son:</p>
<ul><li><b>Renovables</b>: la naturaleza las repone y son prácticamente inagotables (agua, viento, sol, biomasa).</li>
<li><b>No renovables</b>: tardaron millones de años en formarse y se agotan al usarlas (carbón, petróleo, gas natural, uranio).</li></ul>` },
    { tema: "centrales", titulo: "🏭 ¿Qué es una central eléctrica?", html: `
<p>Una <b>central de generación eléctrica</b> es una instalación que <b>transforma alguna forma de energía en electricidad</b>. Conocimos seis tipos:</p>

<div class="box key"><b class="lab">Principio de conservación</b>La energía <b>no se crea ni se destruye, solo se transforma</b>.</div>
<p>Cuando decimos que el celular “se quedó sin batería”, la energía no desapareció: la energía química de la batería se transformó en luz, sonido y calor que ya no podemos aprovechar.</p>

    { tema: "centrales", titulo: "🏭 Cómo funciona cada central", html: `
<p>Casi todas siguen la misma idea: <b>algo hace girar una turbina → la turbina mueve el generador → el generador produce electricidad → el transformador la envía por las líneas de alta tensión</b>. Lo que cambia es <b>qué</b> hace girar la turbina:</p>
<ul><li>💧 <b>Hidroeléctrica</b>: el agua del <b>embalse</b> baja por la <b>tubería de presión</b> y hace girar la <b>turbina hidráulica</b>.</li>
<li>🔥 <b>Termoeléctrica</b>: se quema gas en la <b>caldera</b>, el calor convierte agua en <b>vapor</b> que mueve la <b>turbina de vapor</b>. El <b>condensador</b> enfría el vapor y lo vuelve agua para reutilizarla.</li>
<li>⚛️ <b>Nuclear</b>: en el <b>reactor</b> se dividen átomos de uranio (fisión). Ese calor produce vapor en el <b>generador de vapor</b>. Las <b>barras de control</b> regulan la velocidad de la reacción.</li>
<li>🌬️ <b>Eólica</b>: el viento empuja las <b>aspas</b>; la <b>caja multiplicadora</b> aumenta la velocidad de giro para el <b>generador</b>, que está en la <b>góndola</b>.</li>
<li>🌿 <b>Biomasa</b>: se quema materia orgánica en una <b>caldera</b> y el vapor mueve la turbina.</li>
<li>☀️ <b>Solar fotovoltaica</b>: ¡la excepción! <b>No tiene turbina</b>. Las <b>celdas fotovoltaicas</b> transforman la luz directamente en corriente continua, y el <b>inversor</b> la convierte en corriente alterna.</li></ul>` },
    { tema: "sistemas", titulo: "⚙️ Cada sistema técnico, en detalle", html: `
<ul><li><b>Hidráulico</b>: una <b>bomba</b> genera presión en un líquido (generalmente aceite), las <b>válvulas</b> controlan el flujo y los <b>actuadores</b> (pistones) convierten esa energía en movimiento. Ejemplo: gato hidráulico, frenos del auto.</li>
<li><b>Hídrico</b>: tiene una parte que <b>almacena</b> y otra que <b>distribuye o canaliza</b> el líquido, con válvulas para regularlo. Ejemplo: la red de agua potable de Ushuaia.</li>
<li><b>De control</b>: mide y corrige para mantener un valor estable. Ejemplo: el termostato de la calefacción.</li>
<li><b>Informático</b>: recibe datos, los procesa y entrega información.</li></ul>
<div class="box key"><b class="lab">No confundir</b><b>Hidráulico</b> usa el líquido para <b>transmitir fuerza o movimiento</b>. <b>Hídrico</b> tiene como objetivo <b>almacenar y transportar</b> el líquido.</div>` },
    { tema: "proyecto", titulo: "🧭 Qué se hace en cada etapa", html: `

<li><b>Búsqueda de información</b>: libros, internet, videos, manuales, objetos parecidos.</li>
<li><b>Diseño y análisis del producto</b>: se imaginan soluciones, se elige la mejor y se representa con bocetos, croquis y dibujo técnico.</li>
<li><b>Organización y gestión</b>: se reparten tareas, se reúnen materiales y se calculan costos.</li>
<li><b>Planificación</b>: se ordenan las acciones en el tiempo (cronograma).</li>
<li><b>Construcción</b>: se lleva a la práctica lo pensado y se registra lo que ocurre.</li>
<li><b>Evaluación y perfeccionamiento</b>: se comprueba si funciona y se mejora. ¡Está presente durante <b>todo</b> el proyecto!</li></ol>` }

  /* ---------------- Desafío ---------------- */
  function buildPartida() {
    const bank = lvl().banco, N = Math.min(C.preguntasPorNivel, bank.length), per = Math.max(1, Math.floor(N / TEMA_IDS.length));
    const byT = {}; TEMA_IDS.forEach((t) => (byT[t] = shuffle(range(bank.length).filter((i) => bank[i].tema === t))));
    let pick = []; TEMA_IDS.forEach((t) => (pick = pick.concat(byT[t].slice(0, per))));
    const rest = shuffle(range(bank.length).filter((i) => !pick.includes(i)));
    pick = shuffle(pick.concat(rest.slice(0, N - pick.length)));
    S.partida = { lv: S.lv, qs: pick, i: 0, pts: 0, res: [], cur: null };
    S.racha = 0; save();
  }
  function curQ() { const p = S.partida; return lvl().banco[p.qs[p.i]]; }
  function initCur() {
    const p = S.partida, q = curQ(); if (p.cur) return p.cur;
    const c = { tries: 0, done: false, earned: 0, bad: [] };
    if (q.t === "mc") c.perm = shuffle(range(q.o.length));
    if (q.t === "sort") { c.place = {}; c.sel = null; c.tokOrder = shuffle(range(q.i.length)); }
    if (q.t === "order") { let o = shuffle(range(q.i.length)); let g = 0; while (o.every((v, k) => v === k) && g++ < 10) o = shuffle(o); c.ord = o; }
    p.cur = c; save(); return c;
  }
  FASE.desafio = function () {
    if (!S.partida || S.partida.lv !== S.lv) buildPartida();
    const p = S.partida, q = curQ(), c = initCur(), n = p.qs.length;
    let h = '<div class="panel"><div class="qhead"><span class="qnum">Pregunta ' + (p.i + 1) + " de " + n + ' · <span class="tdot t-' + q.tema + '">' + TM[q.tema].ico + " " + TM[q.tema].corto + "</span></span>" +
      '<span class="chip score">Nivel: ' + p.pts + " / " + MAX_NIVEL + '</span></div><div class="qbar"><i style="width:' + (100 * p.i) / n + '%"></i></div>' +
      '<p class="qtext">' + esc(q.q) + "</p>" + Q[q.t](q, c);
    if (c.done) {
      h += '<div class="fb ' + (c.earned === C.puntosPrimerIntento ? "ok" : c.earned > 0 ? "warn" : "bad") + '"><b>' + (c.earned === C.puntosPrimerIntento ? "¡Excelente! +" + c.earned + " pts" : c.earned > 0 ? "Bien, lo lograste: +" + c.earned + " pts" : "Esta vez no sumaste puntos") + "</b><br>" + esc(q.e) +
        (c.earned < C.puntosPrimerIntento ? '<br><span class="small">📌 Tema para repasar: <b>' + esc(TM[q.tema].nombre) + "</b></span>" : "") + "</div>" +
        '<button class="btn" data-act="q-next" id="q-next">' + (p.i + 1 < n ? "Siguiente pregunta ›" : "Ver mi informe del nivel 📋") + "</button>";
    } else if (c.tries === 1) h += '<div class="fb warn">🤏 ¡Casi! Tenés una oportunidad más (vale ' + C.puntosSegundoIntento + " pts).</div>";
    return h + "</div>";
  };
  FASE_AFTER.desafio = function () { const b = $("#q-next"); if (b) b.focus(); };
  const Q = {};
  Q.mc = function (q, c) {
    return '<div class="opts">' + c.perm.map((k) => { let cls = "";
      if (c.done && k === q.a) cls = "ok"; else if (c.bad.includes(k)) cls = "bad";
      return '<button class="opt ' + cls + '" data-act="q-mc" data-k="' + k + '"' + (c.done || c.bad.includes(k) ? " disabled" : "") + ">" + esc(q.o[k]) + "</button>"; }).join("") + "</div>";
  };
  Q.tf = function (q, c) {
    return '<div class="opts two">' + [true, false].map((v) => { let cls = "";
      if (c.done && v === q.a) cls = "ok"; else if (c.done && c.pick === v) cls = "bad";
      return '<button class="opt ' + cls + '" data-act="q-tf" data-v="' + v + '"' + (c.done ? " disabled" : "") + ">" + (v ? "✔ Verdadero" : "✘ Falso") + "</button>"; }).join("") + "</div>";
  };
  Q.sort = function (q, c) {
    const placed = (k) => c.place[k] != null;
    const tok = (k) => { let cls = "tok"; if (c.sel === k) cls += " sel"; if (c.marks) cls += c.marks[k] ? " ok" : " bad";
      return '<button class="' + cls + '" data-act="q-tok" data-k="' + k + '"' + (c.done ? " disabled" : "") + ">" + esc(q.i[k][0]) + "</button>"; };
    let h = '<p class="small muted">Tocá una tarjeta y después tocá el grupo donde va. Para moverla, tocála de nuevo.</p><div class="pool" aria-label="Tarjetas sin ubicar">' +
      (c.tokOrder.filter((k) => !placed(k)).map(tok).join("") || '<span class="small muted">Todas ubicadas ✔</span>') + '</div><div class="buckets">';
    q.b.forEach((b, bi) => { h += '<div class="bucket" data-act="q-bucket" data-b="' + bi + '" role="button" tabindex="0"><h4>' + esc(b) + "</h4>" + c.tokOrder.filter((k) => c.place[k] === bi).map(tok).join("") + "</div>"; });
    h += "</div>";
    if (c.done && c.earned < C.puntosPrimerIntento) h += '<div class="fb info"><b>Ubicación correcta:</b> ' + q.b.map((b, bi) => "<b>" + esc(b) + "</b>: " + q.i.filter((x) => x[1] === bi).map((x) => esc(x[0])).join(", ")).join(" · ") + "</div>";

  Q.order = function (q, c) {

    c.ord.forEach((k, pos) => { const m = c.marks ? (c.marks[pos] ? " ok" : " bad") : "";
      h += '<li class="order-item' + m + '"><span class="n">' + (pos + 1) + '</span><span class="tx">' + esc(q.i[k]) + "</span>" +
        (c.done ? "" : '<button class="mv" data-act="q-up" data-p="' + pos + '" aria-label="Subir"' + (pos ? "" : " disabled") + '>▲</button><button class="mv" data-act="q-down" data-p="' + pos + '" aria-label="Bajar"' + (pos < c.ord.length - 1 ? "" : " disabled") + ">▼</button>") + "</li>"; });

  };
  function award(c, el) {
    const p = S.partida, q = curQ(); c.done = true; p.pts += c.earned;
    p.res.push({ tema: q.tema, p: c.earned, m: C.puntosPrimerIntento });
    if (c.earned === C.puntosPrimerIntento) { S.racha++; S.rachaMax = Math.max(S.rachaMax, S.racha); } else S.racha = 0;
    if (c.earned > 0) { chime(true); floater("+" + c.earned, el); } else chime(false);
    save(); render(); bumpScore(); say(c.earned ? "Correcto, más " + c.earned + " puntos" : "Respuesta incorrecta");
  }
  function check(el) {
    const q = curQ(), c = S.partida.cur; let okN = 0, tot;
    if (q.t === "sort") { tot = q.i.length; c.marks = {}; q.i.forEach((x, k) => { c.marks[k] = c.place[k] === x[1]; if (c.marks[k]) okN++; }); }
    else { tot = q.i.length; c.marks = c.ord.map((k, pos) => k === pos); okN = c.marks.filter(Boolean).length; }
    if (okN === tot) { c.earned = c.tries === 0 ? C.puntosPrimerIntento : C.puntosSegundoIntento; return award(c, el); }
    if (c.tries === 0) { c.tries = 1; chime(false); save(); render(); say("Hay " + (tot - okN) + " elementos mal ubicados"); return; }
    c.earned = Math.round((C.puntosSegundoIntento * okN) / tot); award(c, el);
  }
  function nextQ() {
    const p = S.partida;
    if (p.i + 1 < p.qs.length) { p.i++; p.cur = null; save(); render(true); return; }
    finishPartida();
  }
  function finishPartida() {
    const p = S.partida, i = p.lv, ts = {};
    TEMA_IDS.forEach((t) => (ts[t] = { p: 0, m: 0 }));
    p.res.forEach((r) => { ts[r.tema].p += r.p; ts[r.tema].m += r.m; });
    S.intentos[i]++; S.ultimo[i] = p.pts; S.temasUltimo[i] = ts;
    if (p.pts >= S.mejor[i] || !S.temasMejor[i]) { S.mejor[i] = Math.max(S.mejor[i], p.pts); S.temasMejor[i] = ts; }
    if (p.pts >= C.minimoParaAvanzar) S.aprobado[i] = true;

    S.partida = null; S.racha = 0;

    else if (S.completo.every(Boolean)) S.codigo = hash(S.id + S.nombre + total());
    S.fase = "informe"; save(); render(true);
    sync(S.completo.every(Boolean) ? "final" : "progreso");
  }

  /* ---------------- Informe del nivel ---------------- */
  function temaRows(ts, consejos) {
    return TEMA_IDS.map((t) => { const x = ts[t]; if (!x || !x.m) return ""; const r = x.p / x.m, st = status(r), col = r >= 0.8 ? "var(--ok)" : r >= 0.5 ? "var(--amber)" : "var(--coral)";
      return '<div class="tema-row"><span><span class="tdot t-' + t + '">' + TM[t].ico + "</span> <b>" + esc(TM[t].nombre) + '</b> <span class="small muted">(' + x.p + "/" + x.m + ' pts)</span></span><span class="status ' + st[2] + '">' + st[1] + " " + st[0] + '</span><div class="meter"><i style="width:' + Math.round(100 * r) + "%;background:" + col + '"></i></div>' +
        (r < 0.8 && consejos ? '<div class="advice">👉 ' + esc(consejos[t]) + "</div>" : "") + "</div>"; }).join("");
  }
  FASE.informe = function () {
    const i = S.lv, n = lvl(), pts = S.ultimo[i], ts = S.temasUltimo[i] || {}, left = C.intentosMaximos - S.intentos[i];
    const passed = pts >= C.minimoParaAvanzar, refz = TEMA_IDS.filter((t) => ts[t] && ts[t].m && ts[t].p / ts[t].m < 0.8);
    let h = lvlHead("Informe") + '<div class="panel"><div class="row"><div><div class="kicker">Puntaje de este intento</div><div class="big-score">' + pts + '<span style="font-size:1.2rem;color:var(--ink2)"> / ' + MAX_NIVEL + "</span></div></div>" +
      '<div style="margin-left:auto;text-align:right">' + stars(pts) + '<div class="small muted">Intento ' + S.intentos[i] + " de " + C.intentosMaximos + " · mejor: " + S.mejor[i] + "</div></div></div>";
    if (passed) h += '<div class="fb ok">🎉 ¡Superaste el nivel <b>' + esc(n.nombre) + "</b>! Ganaste el rango <b>" + esc(n.rango) + "</b>.</div>";
    else if (left > 0) h += '<div class="fb warn">Necesitás <b>' + C.minimoParaAvanzar + " pts</b> para avanzar. Te quedan <b>" + left + " intento(s)</b>. Repasá los temas marcados y volvé a intentarlo: las preguntas cambian.</div>";
    else h += '<div class="fb bad">Usaste los ' + C.intentosMaximos + " intentos. El nivel queda registrado con tu mejor puntaje (" + S.mejor[i] + ") y podés continuar, pero <b>tenés que estudiar los temas marcados</b> antes de la mesa de compensación.</div>";
    h += "</div><div class=\"panel\"><h3>¿Qué contenidos tenés que reforzar?</h3>" +
      (refz.length ? '<p class="muted small">✅ Dominado (80% o más) · 🔁 Repasar (50 a 79%) · ⚠️ Reforzar (menos de 50%)</p>' : '<div class="fb ok">¡Dominaste los cuatro temas en este nivel! 💪</div>') + temaRows(ts, n.consejos) + "</div>";
    h += '<div class="panel"><div class="row">';
    if (S.completo[i]) h += i + 1 < NV.length ? '<button class="btn" data-act="open-lv" data-i="' + (i + 1) + '">Ir al nivel ' + (i + 2) + " " + NV[i + 1].ico + " ›</button>" : '<button class="btn" data-act="to-final">🏆 Ver informe final y certificado</button>';
    if (left > 0) h += '<button class="btn ' + (S.completo[i] ? "ghost" : "") + '" data-act="retry">' + (passed ? "Mejorar mi puntaje (" + left + " intento/s)" : "Reintentar el desafío 🔄") + "</button>";
    h += '<button class="btn ghost" data-act="to-lectura">📖 Volver a leer</button><button class="btn ghost" data-act="to-map">🗺️ Mapa</button></div></div>';
    return h;
  };

  /* ---------------- Informe final ---------------- */
  SCREENS.final = function () {
    const g = temasGlobal(), refz = listaRefuerzo(), pct = Math.round((100 * total()) / MAX_TOTAL);
    let h = '<div class="panel edge"><div class="kicker">Informe final</div><h2>¡Misión cumplida, ' + esc(firstName()) + "!</h2>" +
      '<div class="row"><div><div class="big-score">' + total() + '<span style="font-size:1.2rem;color:var(--ink2)"> / ' + MAX_TOTAL + '</span></div><div class="muted">' + pct + "% del puntaje máximo</div></div></div></div>";
    h += '<div class="panel"><h3>Tus niveles</h3>' + NV.map((n, i) => '<div class="tema-row"><span>' + n.ico + " <b>Nivel " + n.id + " · " + esc(n.nombre) + '</b> <span class="small muted">(' + S.intentos[i] + " intento/s" + (S.aprobado[i] ? "" : ", sin alcanzar el mínimo") + ")</span></span><span>" + stars(S.mejor[i]) + " <b>" + S.mejor[i] + "</b></span></div>").join("") + "</div>";
    h += '<div class="panel"><h3>Dominio de cada tema (todos los niveles)</h3>' + temaRows(g, null) + "</div>";
    h += '<div class="panel"><h3>📌 Antes de la mesa, reforzá esto</h3>' + (refz.length ? "<ul>" + refz.map((x) => "<li><b>" + esc(TM[x.tema].corto) + "</b> (nivel " + NV[x.lv].id + ", " + status(x.r)[0].toLowerCase() + "): " + esc(NV[x.lv].consejos[x.tema]) + "</li>").join("") + "</ul>" : '<div class="fb ok">No tenés temas pendientes. ¡Llegás muy bien preparado/a! 🌟</div>') + "</div>";
    h += '<div class="panel"><div class="row"><button class="btn" data-act="to-cert">🎓 Ver mi certificado</button><button class="btn ghost" data-act="to-map">🗺️ Mapa</button></div></div>';
    return h;
  };

  /* ---------------- Certificado ---------------- */
  SCREENS.cert = function () {
    const pct = Math.round((100 * total()) / MAX_TOTAL);
    return '<div class="panel"><div class="row"><button class="btn" data-act="print">🖨️ Descargar / imprimir (Guardar como PDF)</button><button class="btn ghost" data-act="to-final">‹ Volver al informe</button></div>' +
      '<p class="small muted" style="margin:.6rem 0 0">Tu profesor también recibe una copia de este certificado.</p></div>' +
      '<div class="cert" id="cert"><div style="font-size:.85rem;letter-spacing:.12em;text-transform:uppercase">' + esc(C.escuela) + " · Educación Tecnológica · " + esc(C.curso) + "</div>" +
      "<h1>Certificado de logro</h1><div>Se certifica que</div><div class=\"cname\">" + esc(S.nombre) + "</div>" +
      "<div>completó la <b>Misión Energía Austral</b>, recorrido de autoaprendizaje de la etapa de compensación, superando los niveles<br><b>Reconocer · Comprender · Relacionar · Aplicar</b></div>" +
      '<div class="cscore">' + NV.map((n, i) => "<div><b>" + S.mejor[i] + "</b>Nivel " + n.id + "</div>").join("") + "<div><b>" + total() + " / " + MAX_TOTAL + "</b>Puntaje total (" + pct + "%)</div></div>" +
      "<div>Ushuaia, Tierra del Fuego · " + fecha(S.fin) + '</div><div class="sign"><div>' + esc(S.nombre) + "<br>Estudiante</div><div>" + esc(C.docente) + "<br>Docente</div></div>" +
      '<div class="code">Código de verificación: <b>' + esc(S.codigo || "") + "</b></div></div>";
  };

  /* ---------------- Acciones ---------------- */
  function openLevel(i) {
    if (!unlocked(i)) return; S.lv = i; S.screen = "nivel";
    if (S.partida && S.partida.lv === i) S.fase = "desafio";
    else if (S.intentos[i]) S.fase = "informe";
    else if (!S.leidas[i] || !S.leidas[i].every(Boolean)) S.fase = "lectura";
    else S.fase = exComplete(i) ? "desafio" : "explora";
    save(); render(true);
  }
  const ACT = {
    start() { const v = cleanName($("#name").value); if (!validName(v)) return; S.nombre = v; S.id = uid(); S.inicio = Date.now(); S.screen = "mapa"; save(); render(true); sync("registro"); },
    "to-map"() { go("mapa"); }, "to-final"() { go("final"); }, "to-cert"() { go("cert"); }, print() { window.print(); },
    mute() { S.mute = !S.mute; save(); render(); },
    "open-lv"(el) { openLevel(+el.dataset.i); },
    read(el) { const r = S.leidas[S.lv]; r[+el.dataset.i] = !r[+el.dataset.i]; save(); render(); if (r.every(Boolean)) sync("progreso"); },
    "to-lectura"() { setFase("lectura"); }, "to-explora"() { setFase("explora"); }, "to-informe"() { if (S.intentos[S.lv]) setFase("informe"); },
    "to-desafio"() { if (!exComplete(S.lv) || !canPlay()) return; setFase("desafio"); },
    retry() { if (S.intentos[S.lv] >= C.intentosMaximos) return; S.partida = null; setFase("desafio"); },
    memo(el) { memoClick(+el.dataset.c); },
    "ch-tab"(el) { const e = exState(); e.sel = +el.dataset.i; e.msg = null; save(); render(); },
    "ch-pick"(el) { chainPick(el.dataset.n, el); },
    "xr-sel"(el) { const e = exState(); e.sel = +el.dataset.n; save(); render(); },
    "xr-ans"(el) { const it = lvl().interactivo, e = exState(), p = it.puntos.find((x) => x.n === e.sel); e.ans[p.n] = +el.dataset.k; chime(+el.dataset.k === p.s); save(); render(); if (exComplete(S.lv)) sync("progreso"); },
    "cd-sel"(el) { const e = exState(); e.sel = +el.dataset.i; save(); render(); },
    "cd-ans"(el) { const it = lvl().interactivo, e = exState(); e.ans[e.sel] = +el.dataset.k; chime(+el.dataset.k === it.cartas[e.sel].s); save(); render(); if (exComplete(S.lv)) sync("progreso"); },
    "q-mc"(el) { const q = curQ(), c = S.partida.cur, k = +el.dataset.k; if (c.done) return;
      if (k === q.a) { c.earned = c.tries === 0 ? C.puntosPrimerIntento : C.puntosSegundoIntento; return award(c, el); }
      c.bad.push(k); if (c.tries === 0 && q.o.length > 2) { c.tries = 1; chime(false); el.classList.add("shake"); save(); setTimeout(render, 300); return; }
      c.earned = 0; award(c, el); },
    "q-tf"(el) { const q = curQ(), c = S.partida.cur; if (c.done) return; c.pick = el.dataset.v === "true"; c.earned = c.pick === q.a ? C.puntosPrimerIntento : 0; award(c, el); },
    "q-tok"(el) { const c = S.partida.cur, k = +el.dataset.k; if (c.done) return;
      const bk = el.closest(".bucket"); if (bk && c.sel != null && c.sel !== k) return ACT["q-bucket"](bk);
      c.sel = c.sel === k ? null : k; if (c.marks) c.marks = null; save(); render(); },
    "q-bucket"(el) { const c = S.partida.cur; if (c.done || c.sel == null) return; c.place[c.sel] = +el.dataset.b; c.sel = null; c.marks = null; save(); render(); },
    "q-up"(el) { const c = S.partida.cur, p = +el.dataset.p; [c.ord[p - 1], c.ord[p]] = [c.ord[p], c.ord[p - 1]]; c.marks = null; save(); render(); },
    "q-down"(el) { const c = S.partida.cur, p = +el.dataset.p; [c.ord[p + 1], c.ord[p]] = [c.ord[p], c.ord[p + 1]]; c.marks = null; save(); render(); },
    "q-check"(el) { check(el); }, "q-next"() { nextQ(); },
    "reset-ask"() { $("#reset-zone").innerHTML = '<span class="small">Se borra el progreso guardado en esta computadora (tu profesor conserva lo enviado a la planilla). ¿Seguro? </span><button class="linkish" data-act="reset-yes" style="color:var(--coral)">Sí, cambiar</button> · <button class="linkish" data-act="reset-no">No</button>'; },
    "reset-yes"() { const m = S.mute; S = fresh(); S.mute = m; save(); render(true); }, "reset-no"() { render(); }
  };
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
    if (el.classList.contains("tok") && el.closest(".bucket")) ev.stopPropagation();
    const f = ACT[el.dataset.act]; if (f) f(el);
  });
  document.addEventListener("keydown", (ev) => { const b = ev.target.closest && ev.target.closest(".bucket"); if (b && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); ACT["q-bucket"](b); } });

  if (S.screen === "nivel" && !S.nombre) S.screen = "intro";
  render(true);
  if (S.pendiente) sync("auto");
})();
</script>
</body>
</html>
